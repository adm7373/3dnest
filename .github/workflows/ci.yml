name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m py_compile generate_nest.py
      - name: Generate STL
        run: python generate_nest.py
      - name: Check formatting
        run: git diff --check
      - name: Run tests
        run: pytest
