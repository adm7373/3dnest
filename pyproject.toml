[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-d-nest"
version = "0.1.0"
description = "Generate spherical nest bowls and curved torus-section stick textures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "PyYAML>=6.0",
    "pyglet>=2.0",
]

[project.optional-dependencies]
dev = [
    "fast-simplification>=0.2.0",
    "matplotlib>=3.7",
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["generate_nest"]
